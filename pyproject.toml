[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jax-advection-diffusion"
version = "0.1.0"
description = "A differentiable 2D finite-volume advection-diffusion solver using JAX"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax",
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]